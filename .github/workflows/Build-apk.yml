name: Build PhoneCluster APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-24.04

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract Android project ZIP
    shell: bash
    run: |
      set -e
      test -f source.zip || {
        echo "ERROR: source.zip is missing from repository root"
        exit 1
      }
      mkdir -p /tmp/phonecluster-source
      unzip -q source.zip -d /tmp/phonecluster-source
      test -d /tmp/phonecluster-source/PhoneClusterAndroid || {
        echo "ERROR: ZIP must contain PhoneClusterAndroid/"
        unzip -l source.zip | head -60
        exit 1
      }
      cp -R /tmp/phonecluster-source/PhoneClusterAndroid/. .

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Accept Android SDK licenses
    shell: bash
    run: |
      set -o pipefail
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

  - name: Install Android SDK packages
    shell: bash
    run: |
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Build debug APK
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: PhoneCluster-debug-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
