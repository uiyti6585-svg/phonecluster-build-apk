
name: Build PhoneCluster APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          test -f source.zip || { echo "ERROR: Upload source.zip to the repository root first."; exit 1; }
          mkdir -p /tmp/phonecluster-source
          unzip -q source.zip -d /tmp/phonecluster-source
          test -d /tmp/phonecluster-source/PhoneClusterAndroid || { echo "ERROR: ZIP must contain the PhoneClusterAndroid folder."; exit 1; }
          cp -R /tmp/phonecluster-source/PhoneClusterAndroid/. .

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneCluster-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
